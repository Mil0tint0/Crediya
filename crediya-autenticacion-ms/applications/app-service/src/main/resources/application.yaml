server:
  port: 8080

spring:
  application:
    name: "Autentication"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    url: "jdbc:postgresql://localhost:5432/crediya_auth"
    username: "crediya_user"
    password: "crediya_pass_2025"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
